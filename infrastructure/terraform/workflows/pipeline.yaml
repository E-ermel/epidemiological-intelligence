# Orquestração do pipeline (substituiu a DAG do Airflow).
# Cada passo usa o conector do Cloud Run, que dispara o job e ESPERA a
# execução terminar; se um job falhar, o workflow para nesse passo.
#
# fonte -> bronze (ingestão, em southamerica-east1)
#   -> dim_municipality (IBGE)
#   -> silver (INMET usa a dim + malha para ligar estação a município)
#   -> gold (+ BigQuery) -> modelagem
main:
  steps:
    - ingest:
        parallel:
          branches:
            - ibge:
                steps:
                  - run_ibge_ingest:
                      call: googleapis.run.v2.projects.locations.jobs.run
                      args:
                        name: ${ibge_ingest_job}
                        connector_params:
                          timeout: 7200
            - inmet:
                steps:
                  - run_inmet_ingest:
                      call: googleapis.run.v2.projects.locations.jobs.run
                      args:
                        name: ${inmet_ingest_job}
                        connector_params:
                          timeout: 7200

    - dim_municipality:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${ibge_job}
          connector_params:
            timeout: 7200

    - bronze_to_silver:
        parallel:
          branches:
            - inmet:
                steps:
                  - run_inmet:
                      call: googleapis.run.v2.projects.locations.jobs.run
                      args:
                        name: ${inmet_job}
                        connector_params:
                          timeout: 7200
            - sinan:
                steps:
                  - run_sinan:
                      call: googleapis.run.v2.projects.locations.jobs.run
                      args:
                        name: ${sinan_job}
                        connector_params:
                          timeout: 7200

    # O job gold também carrega o resultado no BigQuery (warehouse.py).
    - silver_to_gold:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${gold_job}
          connector_params:
            timeout: 7200

    - modeling:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${ds_job}
          connector_params:
            timeout: 7200

    - done:
        return: "Pipeline concluído"
