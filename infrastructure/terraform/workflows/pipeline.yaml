# Orquestração do pipeline (substituiu a DAG do Airflow).
# Cada passo usa o conector do Cloud Run, que dispara o job e ESPERA a
# execução terminar; se um job falhar, o workflow para nesse passo.
#
# fonte -> bronze (ingestão, em southamerica-east1)
#   -> dim_municipality (IBGE)
#   -> silver (INMET usa a dim + malha para ligar estação a município;
#      SIH lê os .dbc por UF)
#   -> gold (+ BigQuery) -> modelagem
main:
  steps:
    - ingest:
        parallel:
          branches:
            # Nomes de ramo paralelo precisam ser únicos no workflow
            # inteiro (o bronze_to_silver abaixo já tem um "inmet").
            - ibge_ingest:
                steps:
                  - run_ibge_ingest:
                      call: googleapis.run.v2.projects.locations.jobs.run
                      args:
                        name: ${ibge_ingest_job}
                        connector_params:
                          timeout: 7200
            - inmet_ingest:
                steps:
                  - run_inmet_ingest:
                      call: googleapis.run.v2.projects.locations.jobs.run
                      args:
                        name: ${inmet_ingest_job}
                        connector_params:
                          timeout: 7200
            - sih_ingest:
                steps:
                  - run_sih_ingest:
                      call: googleapis.run.v2.projects.locations.jobs.run
                      args:
                        name: ${sih_ingest_job}
                        connector_params:
                          timeout: 7200
            - sinan_ingest:
                steps:
                  - run_sinan_ingest:
                      call: googleapis.run.v2.projects.locations.jobs.run
                      args:
                        name: ${sinan_ingest_job}
                        connector_params:
                          timeout: 7200
            - sidra_ingest:
                steps:
                  - run_sidra_ingest:
                      call: googleapis.run.v2.projects.locations.jobs.run
                      args:
                        name: ${sidra_ingest_job}
                        connector_params:
                          timeout: 7200
            - atlas_ingest:
                steps:
                  - run_atlas_ingest:
                      call: googleapis.run.v2.projects.locations.jobs.run
                      args:
                        name: ${atlas_ingest_job}
                        connector_params:
                          timeout: 7200
            - mapbiomas_ingest:
                steps:
                  - run_mapbiomas_ingest:
                      call: googleapis.run.v2.projects.locations.jobs.run
                      args:
                        name: ${mapbiomas_ingest_job}
                        connector_params:
                          timeout: 7200
            - prodes_ingest:
                steps:
                  - run_prodes_ingest:
                      call: googleapis.run.v2.projects.locations.jobs.run
                      args:
                        name: ${prodes_ingest_job}
                        connector_params:
                          timeout: 7200

    - dim_municipality:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${ibge_job}
          connector_params:
            timeout: 7200

    - bronze_to_silver:
        parallel:
          branches:
            - inmet:
                steps:
                  - run_inmet:
                      call: googleapis.run.v2.projects.locations.jobs.run
                      args:
                        name: ${inmet_job}
                        connector_params:
                          timeout: 7200
            - sih:
                steps:
                  - run_sih:
                      call: googleapis.run.v2.projects.locations.jobs.run
                      args:
                        name: ${sih_job}
                        connector_params:
                          timeout: 7200
            - sinan:
                steps:
                  - run_sinan:
                      call: googleapis.run.v2.projects.locations.jobs.run
                      args:
                        name: ${sinan_job}
                        connector_params:
                          timeout: 7200
            # População: usa a área da dim_municipality (passo anterior).
            - sidra:
                steps:
                  - run_sidra:
                      call: googleapis.run.v2.projects.locations.jobs.run
                      args:
                        name: ${sidra_job}
                        connector_params:
                          timeout: 7200
            - atlas:
                steps:
                  - run_atlas:
                      call: googleapis.run.v2.projects.locations.jobs.run
                      args:
                        name: ${atlas_job}
                        connector_params:
                          timeout: 7200
            - mapbiomas:
                steps:
                  - run_mapbiomas:
                      call: googleapis.run.v2.projects.locations.jobs.run
                      args:
                        name: ${mapbiomas_job}
                        connector_params:
                          timeout: 7200
            # Desmatamento: usa a área da dim_municipality, como o sidra.
            - prodes:
                steps:
                  - run_prodes:
                      call: googleapis.run.v2.projects.locations.jobs.run
                      args:
                        name: ${prodes_job}
                        connector_params:
                          timeout: 7200

    # Gold nacional (SIH + SINAN + clima por município); o job também
    # carrega o resultado no BigQuery (warehouse.py).
    - silver_to_gold:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${gold_job}
          connector_params:
            timeout: 7200

    # Sem passo de modelagem por enquanto: o modelo atual (um GLM com
    # C(municipality)) não roda no gold nacional, e o substituto sai do
    # benchmark em data_science/benchmarks/. O job continua existindo
    # (${ds_job}) para voltar aqui quando o modelo novo estiver pronto.
    - done:
        return: "Pipeline concluído"
